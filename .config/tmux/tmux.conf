# tmux: sessions (one per project), windows, panes. Ghostty only renders.

# Prefix: § (ISO key left of 1). Never typed in code, unlike backtick.
unbind C-b
set -g prefix §
bind § last-window
bind e send-prefix

# Terminal ---------------------------------------------------------------------
# tmux cannot identify Ghostty, so declare what it supports: truecolor,
# undercurl, OSC 52, OSC 8 links, CSI u keys, sync output, cwd reporting.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:usstyle:clipboard:hyperlinks:extkeys:sync:cstyle:focus:osc7:progressbar"
set -s extended-keys on
set -s extended-keys-format csi-u
set -s set-clipboard on
set -s escape-time 10
set -g focus-events on
set -g allow-passthrough on

# Behaviour -------------------------------------------------------------------
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g display-time 2000
set -g set-titles on
set -g set-titles-string "#S · #W"
setw -g mode-keys vi
setw -g allow-rename off
setw -g automatic-rename on
setw -g automatic-rename-format "#{?#{m:*sh,#{pane_current_command}},#{b:pane_current_path},#{pane_current_command}}"
setw -g pane-scrollbars modal
unbind -n WheelUpStatus
unbind -n WheelDownStatus

# Panes and windows (new ones start in the current directory) -----------------
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind a split-window -h -l 40% -c "#{pane_current_path}" claude

# AeroSpace owns alt+hjkl, so resizing lives behind the prefix (repeatable).
bind -r h resize-pane -L 5
bind -r j resize-pane -D 3
bind -r k resize-pane -U 3
bind -r l resize-pane -R 5
# -d is what makes focus follow the moved window.
bind -r H swap-window -d -t -1
bind -r L swap-window -d -t +1
bind S command-prompt -p "Swap with window:" "swap-window -t '%%'"

# Neovim-aware navigation: Neovim sets @pane-is-vim (lua/config/navigate.lua)
# and handles the key itself, crossing into tmux at its outermost split.
bind -n C-h if -F "#{@pane-is-vim}" "send-keys C-h" "if -F '#{pane_at_left}' '' 'select-pane -L'"
bind -n C-j if -F "#{@pane-is-vim}" "send-keys C-j" "if -F '#{pane_at_bottom}' '' 'select-pane -D'"
bind -n C-k if -F "#{@pane-is-vim}" "send-keys C-k" "if -F '#{pane_at_top}' '' 'select-pane -U'"
bind -n C-l if -F "#{@pane-is-vim}" "send-keys C-l" "if -F '#{pane_at_right}' '' 'select-pane -R'"
# The shell keys those shadow, still reachable behind the prefix.
bind C-l send-keys C-l
bind C-k send-keys C-k

# Copy mode ------------------------------------------------------------------------
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# Sessions -----------------------------------------------------------------------
bind f display-popup -E -w 60% -h 60% -b rounded "~/.config/tmux/sessionizer"
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# Theme: Catppuccin Mocha, matching Ghostty and Neovim --------------------------
fg="#cdd6f4"
dim="#6c7086"
faint="#313244"
yellow="#f9e2af"
blue="#89b4fa"
magenta="#cba6f7"

set -g status-position top
set -g status-interval 15
set -g status-justify left
set -g status-style "bg=default fg=${fg}"
set -g status-left-length 40
set -g status-right-length 120
set -g status-left "#{?client_prefix,#[fg=${magenta}],#[fg=${blue}]}#[bold] #S #[nobold] "
set -g status-right "#(~/.config/tmux/status.sh)"
set -g window-status-format "#[fg=${dim}] #I #W#{?window_zoomed_flag, +,} "
set -g window-status-current-format "#[fg=${fg},bold] #I #W#{?window_zoomed_flag, +,} "
set -g window-status-separator ""
set -g pane-border-lines single
set -g pane-border-style "fg=${faint}"
set -g pane-active-border-style "fg=${dim}"
set -g message-style "bg=default fg=${yellow}"
set -g message-command-style "bg=default fg=${yellow}"
set -g mode-style "bg=${faint} fg=${fg}"
set -g popup-border-style "fg=${dim}"
set -g popup-border-lines rounded
set -g display-panes-active-colour "${yellow}"
set -g display-panes-colour "${dim}"
